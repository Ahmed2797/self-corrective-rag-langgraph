name: Deploy Self RAG Application to EC2

on:
  push:
    branches:
      - main


jobs:

  # ==========================================================
  # CONTINUOUS INTEGRATION + BUILD + PUSH
  # ==========================================================

  Continuous-Integration:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image:"
          echo "$IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

      # --------------------------------------------------------
      # Push Docker Image
      # --------------------------------------------------------

      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Pushing:"
          echo "$IMAGE_URI"

          docker push "$IMAGE_URI"

          echo "Pushing latest tag..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"


  # ==========================================================
  # CONTINUOUS DEPLOYMENT
  # ==========================================================

  Continuous-Deployment:
    name: Deploy to EC2
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:

      # --------------------------------------------------------
      # Configure AWS
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Pull New Docker Image
      # --------------------------------------------------------

      - name: Pull Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Pulling Docker image:"
          echo "$IMAGE_URI"

          docker pull "$IMAGE_URI"

      # --------------------------------------------------------
      # Stop Old Container
      # --------------------------------------------------------

      - name: Stop Old Container
        run: |
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

      # --------------------------------------------------------
      # Run New Container
      # --------------------------------------------------------
      - name: Run New Docker Container
        env:
          HOST_PORT: 8501
          CONTAINER_PORT: 8501
          CONTAINER_NAME: self-rag

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        
        run: |
          set -e

          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Starting container..."
          echo "Image: $IMAGE_URI"
          echo "Port: $HOST_PORT:$CONTAINER_PORT"

          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$HOST_PORT:$CONTAINER_PORT" \
            -v agentic_chatbot_data:/app/data \
            -v agentic_chatbot_uploads:/app/uploads \
            -v agentic_chatbot_faiss:/app/faiss_index_projects \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e PINECONE_API_KEY="$PINECONE_API_KEY" \
            -e PINECONE_INDEX_NAME="$PINECONE_INDEX_NAME" \
            -e TAVILY_API_KEY="$TAVILY_API_KEY" \
            -e LANGSMITH_TRACING="$LANGSMITH_TRACING" \
            -e LANGSMITH_API_KEY="$LANGSMITH_API_KEY" \
            -e LANGSMITH_ENDPOINT="$LANGSMITH_ENDPOINT" \
            -e LANGSMITH_PROJECT="$LANGSMITH_PROJECT" \
            "$IMAGE_URI"

          echo "Container started."
          docker ps

      # --------------------------------------------------------
      # Wait for Streamlit
      # --------------------------------------------------------

      - name: Health Check
        run: |
          echo "Waiting for Streamlit application..."

          for i in {1..12}; do

            if curl \
              --fail \
              --silent \
              http://localhost:8501/_stcore/health \
              > /dev/null; then

              echo "======================================"
              echo "Streamlit application is healthy."
              echo "======================================"

              exit 0
            fi

            echo "Application is not ready yet..."
            echo "Attempt: $i/12"

            sleep 5

          done

          echo "======================================"
          echo "Application failed health check."
          echo "======================================"

          echo "Container status:"
          docker ps -a --filter "name=$CONTAINER_NAME"

          echo "Container logs:"
          docker logs "$CONTAINER_NAME"

          exit 1

      # --------------------------------------------------------
      # Show Container Status
      # --------------------------------------------------------

      - name: Show Container Status
        run: |
          docker ps \
            --filter "name=$CONTAINER_NAME"

      # --------------------------------------------------------
      # Cleanup Old Docker Images
      # --------------------------------------------------------

      - name: Cleanup Docker Images
        run: |
          docker image prune -af
